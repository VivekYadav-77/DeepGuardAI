<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="15" y1="5" x2="85" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#60a5fa"/>
      <stop offset="50%" stopColor="#2563eb"/>
      <stop offset="100%" stopColor="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="10" y1="48" x2="90" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Heavy Aegis Shield Silhouette with solid dark cyber backing -->
  <path d="M 50 6 L 86 19 L 86 54 C 86 74 50 93 50 93 C 50 93 14 74 14 54 L 14 19 Z" fill="#0b0f19" stroke="url(#shieldGrad)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Scanning Laser Bar -->
  <line x1="20" y1="48" x2="80" y2="48" stroke="url(#laserGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Inner Cyber Circuit Track -->
  <path d="M 50 17 L 76 27 L 76 52 C 76 66 50 80 50 80 C 50 66 24 52 24 27 Z" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 3"/>

  <!-- 4 Neural Layer Cardinal Nodes -->
  <circle cx="50" cy="27" r="3.5" fill="#60a5fa"/>
  <circle cx="50" cy="69" r="3.5" fill="#60a5fa"/>
  <circle cx="33" cy="48" r="3.5" fill="#60a5fa"/>
  <circle cx="67" cy="48" r="3.5" fill="#60a5fa"/>

  <!-- Central Quantum AI Nexus Diamond -->
  <path d="M 50 37 L 61 48 L 50 59 L 39 48 Z" fill="#2563eb" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="50" cy="48" r="2.5" fill="#ffffff"/>
</svg>
